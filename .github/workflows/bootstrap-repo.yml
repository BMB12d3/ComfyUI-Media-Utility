name: Bootstrap repository

on:
  push:
    paths:
      - '.github/bootstrap/READY'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack prepared source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .github/bootstrap/payload_xz.part* | base64 -d > /tmp/repo.tar.xz
          tar -xJf /tmp/repo.tar.xz -C .
          mkdir -p docs/screenshots
          cat .github/bootstrap/screen_extract.part* | base64 -d > docs/screenshots/extract-trim.jpg
          cat .github/bootstrap/screen_sort.part* | base64 -d > docs/screenshots/sort.jpg
          cat .github/bootstrap/screen_compare.part* | base64 -d > docs/screenshots/compare.jpg
          rm -rf .github/bootstrap
          rm -f .github/workflows/bootstrap-repo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Populate ComfyUI Media Utility v1.0.0 [skip ci]"
          git push
